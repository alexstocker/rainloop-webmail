name: PHP Composer

on:
  push:
    branches:
      - master
      - 1.18-devel
      - feature/*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install PHPCompatibility
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer false
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer:^4.0 \
            phpcompatibility/php-compatibility:10.x-dev
          phpcs_bin="$(composer global config bin-dir --absolute)"
          echo "$phpcs_bin" >> "$GITHUB_PATH"
          "$phpcs_bin/phpcs" --config-set installed_paths "$(composer global config home)/vendor/phpcompatibility/php-compatibility"

      - name: Check PHP 8.3 compatibility
        run: |
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT

          if phpcs -p . --standard=PHPCompatibility --runtime-set testVersion 8.3 --ignore=vendor/* >"$output_file" 2>&1; then
            cat "$output_file"
            exit 0
          else
            phpcs_status=$?
          fi

          cat "$output_file"
          if [ "$phpcs_status" -le 3 ]; then
            echo "::warning title=PHP 8.3 compatibility::PHPCompatibility reported findings (PHPCS exit code $phpcs_status); see this step's log."
            exit 0
          fi

          exit "$phpcs_status"
